version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: hangnim-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hangnim_rental
    ports:
      - "5432:5432"
    volumes:
      - hangnim_postgres_data:/var/lib/postgresql/data

volumes:
  hangnim_postgres_data: